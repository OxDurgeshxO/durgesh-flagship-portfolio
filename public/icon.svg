<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150f26" />
      <stop offset="100%" stop-color="#0b0914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Rounded Squircle Canvas -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="5" />

  <!-- Subtle Inner Ambient Halo -->
  <circle cx="64" cy="64" r="42" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

  <!-- DDS Tech Monogram -->
  <text x="56" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-1" text-anchor="middle">
    DDS
  </text>

  <!-- Radiant Rose Quartz Accent Dot -->
  <circle cx="98" cy="74" r="6.5" fill="#f43f5e" filter="url(#glow)" />
</svg>
