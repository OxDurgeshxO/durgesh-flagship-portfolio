name: Portfolio Quality Gate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Audit & Test Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Verify code style and lint rules
        run: npm run lint

      - name: Strict TypeScript typecheck
        run: npm run typecheck

      - name: Run dependency security audit
        run: npm run audit

      - name: Execute static production export
        run: npm run build

      - name: Execute unit and integration assertions
        run: npm test

      - name: Validate external links
        run: npm run check:links
