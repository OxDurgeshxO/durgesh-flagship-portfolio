name: Portfolio Quality Gate

on:
  push:
    branches: [main, v6]
    tags: ['v*']
  pull_request:
    branches: [main, v6]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Audit & Test Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 20
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Verify code style and lint rules
        run: npm run lint

      - name: Strict TypeScript typecheck
        run: npm run typecheck

      - name: Run dependency security audit
        run: npm run audit

      - name: Execute static production export
        run: npm run build

      - name: Execute unit and integration assertions
        run: npm test

      - name: Validate external links
        run: npm run check:links
