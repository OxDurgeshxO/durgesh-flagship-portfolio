name: Secret & Credential Scan

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  trufflehog:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@288a8a8643a2c5a36b81d231c550dccfa0beeb64 # was @main (mutable branch) — pinned to the commit main pointed at; move to a release tag deliberately
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
